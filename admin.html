<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administration - Toutou Map</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #222;
    }

    header {
      background: #079447;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
    }

    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .bloc {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .titre {
      color: #079447;
      margin-top: 0;
    }

    .message {
      background: #fff7dc;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🐾 Toutou Map</h1>
    <p>Espace d'administration</p>
  </header>

  <main>
    <div id="connexion-admin" class="bloc">
    <h2 class="title">🔐 Connexion administrateur</h2>

    <input
        type="email"
        id="admin-email"
        placeholder="Adresse email"
    >

    <input
        type="password"
        id="admin-password"
        placeholder="Mot de passe"
    >

    <button onclick="connexionAdmin()">
        Se connecter
    </button>

    <p id="message-connexion"></p>
</div>

    <div class="bloc">

      <h2 class="titre">📍 Signalements à vérifier</h2>

      <p>
        Cette page permettra de contrôler les nouveaux
        distributeurs signalés par les utilisateurs.
      </p>

      <div class="message">
        ⏳ Chargement des signalements...
      </div>

    </div>

  </main>
<script>
  const SUPABASE_URL = "https://lhkmboiukbjqdgminwod.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ce2x-kfGFq7hZ7f4yH7C2A_-EuAEtEj";
async function obtenirAdresse(latitude, longitude) {
    try {
        const reponse = await fetch(
            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`
        );

        if (!reponse.ok) {
            return "Adresse non disponible";
        }

        const donnees = await reponse.json();

const adresse = donnees.address || {};

const rue =
    adresse.road ||
    adresse.pedestrian ||
    adresse.footway ||
    adresse.place ||
    "";

const numero = adresse.house_number || "";

const codePostal = adresse.postcode || "";

const ville =
    adresse.city ||
    adresse.town ||
    adresse.village ||
    adresse.municipality ||
    "";

const ligneRue = [numero, rue]
    .filter(Boolean)
    .join(" ");

const ligneVille = [codePostal, ville]
    .filter(Boolean)
    .join(" ");

const adresseSimplifiee = [
    ligneRue,
    ligneVille
]
    .filter(Boolean)
    .join(", ");

return adresseSimplifiee || donnees.display_name || "Adresse non disponible";

    } catch (erreur) {
        console.error("Erreur adresse :", erreur);
        return "Adresse non disponible";
    }
}
  async function chargerSignalements() {
    const zone = document.querySelector(".message");

    try {
      const reponse = await fetch(
        SUPABASE_URL +
        "/rest/v1/distributeurs" +
        "?select=id,created_at,latitude,longitude,etat,type" +
        "&etat=eq.A_VERIFIER" +
        "&type=eq.signalement_utilisateur" +
        "&order=created_at.desc",
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        }
      );

      if (!reponse.ok) {
        throw new Error(await reponse.text());
      }

      const signalements = await reponse.json();

      if (signalements.length === 0) {
        zone.innerHTML = "✅ Aucun signalement à vérifier.";
        return;
      }

     const cartes = await Promise.all(
    signalements.map(async (signalement) => {

        const adresse = await obtenirAdresse(
            signalement.latitude,
            signalement.longitude
        );

        return `
            <div style="
                background:white;
                padding:18px;
                margin-bottom:12px;
                border-radius:10px;
                border:1px solid #ddd;
            ">

                <strong>📍 Signalement #${signalement.id}</strong><br><br>

                <strong>Adresse :</strong> ${adresse}<br><br>

                Latitude : ${signalement.latitude}<br>
                Longitude : ${signalement.longitude}<br>
                Statut : <strong>${signalement.etat}</strong><br><br>

                <a
                    href="https://www.openstreetmap.org/?mlat=${signalement.latitude}&mlon=${signalement.longitude}#map=19/${signalement.latitude}/${signalement.longitude}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    🗺️ Voir sur la carte
                </a>

                <br><br>

                <button onclick="validerSignalement(${signalement.id})">
                    ✅ Valider le distributeur
                </button>

                <button onclick="refuserSignalement(${signalement.id})">
                    ❌ Refuser
                </button>

            </div>
        `;
    })
);

zone.innerHTML = cartes.join("");

    } catch (erreur) {
      console.error(erreur);
      zone.innerHTML = "❌ Impossible de charger les signalements.";
    }
  }
  async function validerSignalement(id) {
    const token = localStorage.getItem("toutou_admin_token");

    if (!token) {
        alert("❌ Vous devez être connecté en administrateur.");
        return;
    }

    try {
        const reponse = await fetch(
            SUPABASE_URL + "/rest/v1/distributeurs?id=eq." + id,
            {
                method: "PATCH",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json",
                    "Prefer": "return=minimal"
                },
                body: JSON.stringify({
                    etat: "PLEIN"
                })
            }
        );

        if (!reponse.ok) {
            const erreur = await reponse.text();
            console.error("Erreur validation :", erreur);
            alert("❌ Impossible de valider le distributeur.");
            return;
        }

        alert("✅ Distributeur validé.");

        chargerSignalements();

    } catch (erreur) {
        console.error(erreur);
        alert("❌ Une erreur est survenue.");
    }
}
  async function refuserSignalement(id) {
    const token = localStorage.getItem("toutou_admin_token");

    if (!token) {
        alert("❌ Vous devez être connecté en administrateur.");
        return;
    }

    const confirmation = confirm(
        "Voulez-vous vraiment refuser ce signalement ?"
    );

    if (!confirmation) {
        return;
    }

    try {
        const reponse = await fetch(
            SUPABASE_URL + "/rest/v1/distributeurs?id=eq." + id,
            {
                method: "PATCH",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json",
                    "Prefer": "return=minimal"
                },
                body: JSON.stringify({
                    etat: "REFUSE"
                })
            }
        );

        if (reponse.status === 401) {
            localStorage.removeItem("toutou_admin_token");
            alert("🔐 Votre session a expiré. Veuillez vous reconnecter.");
            location.reload();
            return;
        }

        if (!reponse.ok) {
            const erreur = await reponse.text();
            console.error("Erreur refus :", erreur);
            alert("❌ Impossible de refuser le signalement.");
            return;
        }

        alert("❌ Signalement refusé.");

        chargerSignalements();

    } catch (erreur) {
        console.error(erreur);
        alert("❌ Une erreur est survenue.");
    }
}
async function connexionAdmin() {
    const email = document.getElementById("admin-email").value;
    const password = document.getElementById("admin-password").value;
    const message = document.getElementById("message-connexion");

    message.textContent = "Connexion en cours...";

    try {
        const reponse = await fetch(
            SUPABASE_URL + "/auth/v1/token?grant_type=password",
            {
                method: "POST",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        const donnees = await reponse.json();

        if (!reponse.ok) {
            console.error(donnees);
            message.textContent = "❌ Email ou mot de passe incorrect.";
            return;
        }

        localStorage.setItem(
            "toutou_admin_token",
            donnees.access_token
        );

        message.textContent = "✅ Connexion réussie.";

        document.getElementById("connexion-admin").style.display = "none";
    } catch (erreur) {
        console.error(erreur);
        message.textContent = "❌ Impossible de se connecter.";
    }
}
  function verifierConnexionAdmin() {
    const token = localStorage.getItem("toutou_admin_token");

    if (token) {
        document.getElementById("connexion-admin").style.display = "none";
    }
}

verifierConnexionAdmin();
  chargerSignalements();
</script>
</body>
</html>
