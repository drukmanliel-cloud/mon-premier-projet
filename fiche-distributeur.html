<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche distributeur - Toutou Map</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5ff;
            color: #222;
        }

        .fiche {
            max-width: 600px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        h1 {
            color: #0B8F3C;
        }

        .etat {
            color: #0B8F3C;
            font-size: 22px;
            font-weight: bold;
        }

        .bouton {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
    padding: 14px 22px;
    background: #0B8F3C;
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
    font-size: 17px;
    border: none;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    box-shadow: 0 4px 12px rgba(11, 143, 60, 0.20);
}

.bouton:hover {
    background: #087a33;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(11, 143, 60, 0.28);
}
.signalement {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 12px;
}

#bouton-plein,
#bouton-vide {
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

#bouton-plein {
    background: #e9f8ef;
    color: #0B8F3C;
    border: 2px solid #0B8F3C;
}

#bouton-vide {
    background: #fff0f0;
    color: #d93025;
    border: 2px solid #d93025;
}

#bouton-plein:hover,
#bouton-vide:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
}
        .retour {
            display: block;
            margin-top: 30px;
            color: #0B8F3C;
            text-decoration: none;
            font-weight: bold;
        }
  #message-statut {
    margin-top: 15px;
    min-height: 24px;
    font-size: 16px;
    font-weight: 600;
}

.message-succes {
    color: #0B8F3C;
}
    </style>
</head>

<body>

    <div class="fiche">

        <h1>🐾 Toutou Map</h1>

<h2>📍 <span id="nom-distributeur"></span></h2>

        <p>📍 Emplacement : <span id="emplacement"></span></p>

        <p class="etat" id="bloc-etat">
    <span id="icone-etat">🟢</span>
    <span id="etat"></span>
</p>
<p>
  🕒 Dernière vérification :
  <span id="derniere-verification">Non renseignée</span>
</p>
        <p>💩 Distributeur de sacs à crottes</p>
<p><strong>Vous êtes devant ce distributeur ?</strong></p>
<p>Aidez les autres utilisateurs :</p>

<div class="signalement">
    <button id="bouton-plein">🟢 Il y a des sacs</button>
    <button id="bouton-vide">🔴 Il est vide</button>
</div>
<p id="message-statut"></p>
      <a class="bouton"
    id="bouton-itineraire"
    href="#"
    target="_blank">
    🚶 Y aller
</a>

        <a class="retour" href="index.html">
            ← Retour à Toutou Map
        </a>

    </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const params = new URLSearchParams(window.location.search);

const emplacement = params.get("emplacement");
const etat = params.get("etat");
const lat = params.get("lat");
const lng = params.get("lng");
const id = params.get("id");
const derniereVerification = params.get("verification");

document.getElementById("emplacement").textContent = emplacement || "Non renseigné";
    async function chargerAdresseSiManquante() {
    const emplacementManquant =
        !emplacement ||
        emplacement === "Emplacement non renseigné" ||
        emplacement === "Non renseigné";

    if (!emplacementManquant || !lat || !lng) {
        return;
    }

    try {
        const reponse = await fetch(
            "https://nominatim.openstreetmap.org/reverse?format=json&lat=" +
            encodeURIComponent(lat) +
            "&lon=" +
            encodeURIComponent(lng)
        );

        if (!reponse.ok) {
            return;
        }

        const data = await reponse.json();

       if (data && data.address) {
    const adresse = data.address;

    const rue =
        adresse.road ||
        adresse.pedestrian ||
        adresse.path ||
        adresse.residential ||
        "Emplacement";

    const codePostal = adresse.postcode || "";
    const ville =
        adresse.city ||
        adresse.town ||
        adresse.village ||
        adresse.municipality ||
        "";

    const adresseCourte =
        rue +
        (codePostal ? ", " + codePostal : "") +
        (ville ? " " + ville : "");

    document.getElementById("emplacement").textContent = adresseCourte;
}
    } catch (error) {
        console.error("Erreur récupération adresse :", error);
    }
}

chargerAdresseSiManquante();
document.getElementById("nom-distributeur").textContent = "Distributeur Toutou Map";
document.getElementById("etat").textContent = etat || "Non renseigné";
 if (derniereVerification) {
  const date = new Date(derniereVerification);

  document.getElementById("derniere-verification").textContent =
    date.toLocaleString("fr-FR", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });
}   
const iconeEtat = document.getElementById("icone-etat");

if (etat === "PLEIN") {
    iconeEtat.textContent = "🟢";
} else if (etat === "VIDE") {
    iconeEtat.textContent = "🔴";
} else {
    iconeEtat.textContent = "⚪";
}

if (lat && lng) {
    document.getElementById("bouton-itineraire").href =
        "https://www.google.com/maps/dir/?api=1&destination=" + lat + "," + lng;
}
// ===== CONNEXION SUPABASE =====
const SUPABASE_URL = "https://lhkmboiukbjqdgminwod.supabase.co";

const SUPABASE_KEY = "sb_publishable_Ce2x-kfGFq7hZ7f4yH7C2A_-EuAEtEj";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ===== BOUTON : IL Y A DES SACS =====
document.getElementById("bouton-plein").addEventListener("click", async function () {
const cleVote = "toutoumap_vote_statut_" + id;

const dernierVote = localStorage.getItem(cleVote);
const dureeBlocage = 60 * 60 * 1000; // 1 heure

if (dernierVote && Date.now() - new Date(dernierVote).getTime() < dureeBlocage) {
    alert("🐾 Vous avez déjà signalé l'état de ce distributeur il y a moins d'une heure.");
    return;
}
   const { data, error } = await supabaseClient
    .from("distributeurs")
    .update({
        etat: "PLEIN",
        derniere_verification: new Date().toISOString()
    })
    .eq("id", parseInt(id))
    .select();

console.log("Lignes modifiées :", data);
console.log("Erreur Supabase :", error);
        

    if (error) {
        console.error("Erreur Supabase :", error);
        alert("Erreur pendant l'enregistrement");
        return;
    }
localStorage.setItem(cleVote, new Date().toISOString());
   document.getElementById("etat").textContent = "PLEIN";
document.getElementById("icone-etat").textContent = "🟢";

const maintenant = new Date();

document.getElementById("derniere-verification").textContent =
    maintenant.toLocaleString("fr-FR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
const url = new URL(window.location.href);
url.searchParams.set("etat", "PLEIN");
url.searchParams.set("verification", maintenant.toISOString());
window.history.replaceState({}, "", url);
const messageStatut = document.getElementById("message-statut");
messageStatut.textContent = "✅ Merci ! Le distributeur est signalé avec des sacs.";
messageStatut.className = "message-succes";
});


// ===== BOUTON : C'EST VIDE =====
document.getElementById("bouton-vide").addEventListener("click", async function () {
const cleVote = "toutoumap_vote_statut_" + id;

const dernierVote = localStorage.getItem(cleVote);
const dureeBlocage = 60 * 60 * 1000; // 1 heure

if (dernierVote && Date.now() - new Date(dernierVote).getTime() < dureeBlocage) {
    alert("🐾 Vous avez déjà signalé l'état de ce distributeur il y a moins d'une heure.");
    return;
}
    const { error } = await supabaseClient
        .from("distributeurs")
        .update({
    etat: "VIDE",
   derniere_verification: new Date().toISOString()
})
        .eq("id", parseInt(id))

    if (error) {
        console.error("Erreur Supabase :", error);
        alert("Erreur pendant l'enregistrement");
        return;
    }
localStorage.setItem(cleVote, new Date().toISOString());
    document.getElementById("etat").textContent = "VIDE";
document.getElementById("icone-etat").textContent = "🔴";

const maintenantVide = new Date();

document.getElementById("derniere-verification").textContent =
    maintenantVide.toLocaleString("fr-FR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
const url = new URL(window.location.href);
url.searchParams.set("etat", "VIDE");
url.searchParams.set("verification", maintenantVide.toISOString());
window.history.replaceState({}, "", url);
const messageStatut = document.getElementById("message-statut");
messageStatut.textContent = "✅ Merci ! Le distributeur est signalé vide.";
messageStatut.className = "message-succes";
});
</script>
</body>
</html>
