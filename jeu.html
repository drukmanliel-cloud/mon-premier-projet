<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-jeu | Toutou Map</title>
  <style>
  body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f5f7f5;
  }

  #jeu {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 550px;
    margin: 25px auto;
    background: #e5e5e5;
    border: 4px solid #0B8F3C;
    border-radius: 20px;
    overflow: hidden;
  }

  #chien {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 55px;
  }
    #crotte {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 40px;
}
    #game-over {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80%;
    z-index: 10;
    text-align: center;
}
</style>
</head>

<body>


  <h1>🐾 Toutou Game 💩</h1>
  <p>Ramasse un maximum de crottes !</p>
  <p id="score">Score : 0</p>
  <p id="vies">Vies : ❤️❤️❤️</p>

  <div id="jeu">
    <div id="crotte">💩</div>
    <div id="chien">🐕</div>
    <div id="game-over" style="display: none;">
    <h2>💩 GAME OVER</h2>
    <p id="score-final">Score : 0</p>
    <button id="rejouer">🔄 Rejouer</button>
</div>
  </div>

<script>
  const chien = document.getElementById("chien");
  const jeu = document.getElementById("jeu");
const crotte = document.getElementById("crotte");
  const affichageScore = document.getElementById("score");
  const affichageVies = document.getElementById("vies");
const gameOver = document.getElementById("game-over");
const scoreFinal = document.getElementById("score-final");
let vies = 3;
let score = 0;
let vitesse = 3;
let positionCrotte = 20;
let jeuTermine = false;

setInterval(function() {
  if (jeuTermine) return;
  positionCrotte += vitesse;

  crotte.style.top = positionCrotte + "px";

  const zoneChien = chien.getBoundingClientRect();
const zoneCrotte = crotte.getBoundingClientRect();

if (
  zoneCrotte.bottom >= zoneChien.top &&
  zoneCrotte.top <= zoneChien.bottom &&
  zoneCrotte.right >= zoneChien.left &&
  zoneCrotte.left <= zoneChien.right
) {
  score += 1;
affichageScore.textContent = "Score : " + score;
  vitesse += 0.15;
  positionCrotte = -40;
  crotte.style.left = Math.floor(Math.random() * 90 + 5) + "%";
}

if (positionCrotte > 550) {
  vies -= 1;
affichageVies.textContent = "Vies : " + "❤️".repeat(vies);
  if (vies === 0) {
    jeuTermine = true;
    scoreFinal.textContent = "Score : " + score;
    gameOver.style.display = "block";
}
  positionCrotte = -40;
  crotte.style.left = Math.floor(Math.random() * 90 + 5) + "%";
}
}, 30);
  let positionChien = 50;

  document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowLeft") {
      positionChien -= 5;
    }

    if (event.key === "ArrowRight") {
      positionChien += 5;
    }

    if (positionChien < 5) {
      positionChien = 5;
    }

    if (positionChien > 95) {
      positionChien = 95;
    }

    chien.style.left = positionChien + "%";
  });
</script>
</body>

</html>
