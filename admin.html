<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administration - Toutou Map</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #222;
    }

    header {
      background: #079447;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
    }

    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .bloc {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .titre {
      color: #079447;
      margin-top: 0;
    }

    .message {
      background: #fff7dc;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🐾 Toutou Map</h1>
    <p>Espace d'administration</p>
  </header>

  <main>

    <div class="bloc">

      <h2 class="titre">📍 Signalements à vérifier</h2>

      <p>
        Cette page permettra de contrôler les nouveaux
        distributeurs signalés par les utilisateurs.
      </p>

      <div class="message">
        ⏳ Chargement des signalements...
      </div>

    </div>

  </main>

</body>
</html>
