<!DOCTYPE html>
<html lang="fr">

<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Toutou Map vous aide à trouver facilement les distributeurs de sacs pour chien près de vous grâce à une carte collaborative simple et gratuite.">
    <title>Toutou Map – Trouver un distributeur de sacs pour chien près de vous</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

</head>

<body class="home-page">

    <header class="app-header">
    <div class="logo-zone">
       <img src="logo-toutou-map.png" alt="Toutou Map - Le sac au bon endroit" class="logo-toutou-map">

        <div class="intro-home">
           <p class="intro-small">🐶 L'application pensée pour les propriétaires de chiens</p>

<p class="intro-title">
  Les sacs pour votre chien,<br>
  toujours à portée de patte. 🐾
</p>

<p class="intro-description">
  Trouvez facilement le distributeur le plus proche en quelques secondes.
</p>

<p class="intro-fun">
  Pour des balades plus tranquilles, des rues plus propres… et zéro mauvaise surprise ! 💩
</p>
        </div>
    </div>
</header>

    <main>

        <section>
           

            <div class="actions-principales">
  <button>📍 Trouver un distributeur</button>

  <button
    id="bouton-signaler"
    onclick="window.location.href='signaler.html'">
    <span class="icone-signalement">⚠</span> Signaler un distributeur manquant
  </button>
</div>
            <div id="map"></div>
        </section>

       

    </main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>

</html>
