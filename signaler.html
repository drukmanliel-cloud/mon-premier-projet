<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Signaler un distributeur - Toutou Map</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6ff;
      margin: 0;
      padding: 30px;
    }

    .carte {
      max-width: 650px;
      margin: 40px auto;
      background: white;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      color: #07963f;
    }

    button {
      background: #07963f;
      color: white;
      border: none;
      padding: 15px 20px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .retour {
      display: block;
      margin-top: 30px;
      color: #07963f;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="carte">

    <h1>🐾 Toutou Map</h1>

    <h2>➕ Signaler un distributeur manquant</h2>

    <p>
      Vous avez trouvé un distributeur de sacs qui n'apparaît pas encore sur Toutou Map ?
    </p>

    <p>
      Aidez la communauté en nous indiquant son emplacement.
    </p>

    <button type="button" id="bouton-position">
  📍 Utiliser ma position
</button>

<p id="message-position"></p>
    <button type="button" id="bouton-confirmer" style="display:none;">
  ✅ Confirmer ce distributeur
</button>

<p id="message-confirmation"></p>

    <a class="retour" href="index.html">
      ← Retour à Toutou Map
    </a>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const boutonPosition = document.getElementById("bouton-position");
  const messagePosition = document.getElementById("message-position");
  const boutonConfirmer = document.getElementById("bouton-confirmer");
  const messageConfirmation = document.getElementById("message-confirmation");
  let latitudeTrouvee = null;
let longitudeTrouvee = null;
const SUPABASE_URL = "https://lhkmboiukbjqdgminwod.supabase.co";

const SUPABASE_KEY = "sb_publishable_Ce2x-kfGFq7hZ7f4yH7C2A_-EuAEtEj";
 const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
); 

  boutonPosition.addEventListener("click", () => {

    if (!navigator.geolocation) {
      messagePosition.textContent =
        "❌ La géolocalisation n'est pas disponible sur cet appareil.";
      return;
    }

    messagePosition.textContent = "📍 Recherche de votre position...";

    navigator.geolocation.getCurrentPosition(
     async (position) => {
        latitudeTrouvee = position.coords.latitude;
longitudeTrouvee = position.coords.longitude;
       let adresseTrouvee = "Adresse non trouvée";

try {
  const reponse = await fetch(
    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitudeTrouvee}&lon=${longitudeTrouvee}&zoom=18&addressdetails=1`
  );

  const resultat = await reponse.json();
  const adresse = resultat.address || {};

  const rue = adresse.road ||
              adresse.pedestrian ||
              adresse.footway ||
              adresse.residential ||
              "";

  const numero = adresse.house_number || "";

  const ville = adresse.city ||
                adresse.town ||
                adresse.village ||
                adresse.municipality ||
                "";

  adresseTrouvee =
    [numero, rue].filter(Boolean).join(" ") +
    (ville ? ", " + ville : "");

  if (!adresseTrouvee.trim()) {
    adresseTrouvee = resultat.display_name || "Adresse non trouvée";
  }

} catch (erreur) {
  console.error("Erreur récupération adresse :", erreur);
}
        boutonConfirmer.style.display = "inline-block";

 messagePosition.innerHTML =
  "✅ Position trouvée.<br>" +
  "📍 " + adresseTrouvee + "<br>" +
  "Latitude : " + latitudeTrouvee + "<br>" +
  "Longitude : " + longitudeTrouvee;
      },

      (erreur) => {
        console.error(erreur);

        messagePosition.textContent =
          "❌ Impossible de récupérer votre position.";
      },

      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }
    );

  });
  boutonConfirmer.addEventListener("click", async () => {

  if (latitudeTrouvee === null || longitudeTrouvee === null) {
    messageConfirmation.textContent =
      "❌ Position introuvable. Utilisez d'abord votre position.";
    return;
  }

  boutonConfirmer.disabled = true;
  messageConfirmation.textContent = "⏳ Enregistrement du signalement...";

  const { data, error } = await supabaseClient
    .from("distributeurs")
    .insert({
      emplacement: "Distributeur signalé par un utilisateur",
      latitude: latitudeTrouvee,
      longitude: longitudeTrouvee,
      etat: "signalement_utilisateur"
    })
    .select();

  console.log("Nouveau distributeur :", data);
  console.log("Erreur Supabase :", error);

  if (error) {
    messageConfirmation.textContent =
      "❌ Impossible d'enregistrer le distributeur.";
    boutonConfirmer.disabled = false;
    return;
  }

  messageConfirmation.textContent =
    "✅ Merci ! Le distributeur a bien été signalé et sera vérifié.";

  boutonConfirmer.style.display = "none";
});
</script>
</body>
</html>
