<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche distributeur - Toutou Map</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5ff;
            color: #222;
        }

        .fiche {
            max-width: 600px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        h1 {
            color: #0B8F3C;
        }

        .etat {
            color: #0B8F3C;
            font-size: 22px;
            font-weight: bold;
        }

        .bouton {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 20px;
            background: #0B8F3C;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .retour {
            display: block;
            margin-top: 30px;
            color: #0B8F3C;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="fiche">

        <h1>🐾 Toutou Map</h1>

<h2>📍 Distributeur <span id="nom-distributeur"></span></h2>

        <p>📍 Emplacement : <span id="emplacement"></span></p>

        <p class="etat" id="bloc-etat">
    <span id="icone-etat">🟢</span>
    <span id="etat"></span>
</p>

        <p>💩 Distributeur de sacs à déjections canines</p>

      <a class="bouton"
    id="bouton-itineraire"
    href="#"
    target="_blank">
    🚶 Y aller
</a>

        <a class="retour" href="index.html">
            ← Retour à Toutou Map
        </a>

    </div>
<script>
const params = new URLSearchParams(window.location.search);

const emplacement = params.get("emplacement");
const etat = params.get("etat");
const lat = params.get("lat");
const lng = params.get("lng");

document.getElementById("emplacement").textContent = emplacement || "Non renseigné";
document.getElementById("nom-distributeur").textContent = emplacement || "Non renseigné";
document.getElementById("etat").textContent = etat || "Non renseigné";
const iconeEtat = document.getElementById("icone-etat");

if (etat === "PLEIN") {
    iconeEtat.textContent = "🟢";
} else if (etat === "VIDE") {
    iconeEtat.textContent = "🔴";
} else {
    iconeEtat.textContent = "⚪";
}

if (lat && lng) {
    document.getElementById("bouton-itineraire").href =
        "https://www.google.com/maps/dir/?api=1&destination=" + lat + "," + lng;
}

</script>
</body>
</html>
