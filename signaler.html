<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Signaler un distributeur - Toutou Map</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6ff;
      margin: 0;
      padding: 30px;
    }

    .carte {
      max-width: 650px;
      margin: 40px auto;
      background: white;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      color: #07963f;
    }

    button {
      background: #07963f;
      color: white;
      border: none;
      padding: 15px 20px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .retour {
      display: block;
      margin-top: 30px;
      color: #07963f;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="carte">

    <h1>🐾 Toutou Map</h1>

    <h2>➕ Signaler un distributeur manquant</h2>

    <p>
      Vous avez trouvé un distributeur de sacs qui n'apparaît pas encore sur Toutou Map ?
    </p>

    <p>
      Aidez la communauté en nous indiquant son emplacement.
    </p>

    <button type="button" id="bouton-position">
  📍 Utiliser ma position
</button>

<p id="message-position"></p>

    <a class="retour" href="index.html">
      ← Retour à Toutou Map
    </a>

  </div>
<script>
  const boutonPosition = document.getElementById("bouton-position");
  const messagePosition = document.getElementById("message-position");

  boutonPosition.addEventListener("click", () => {

    if (!navigator.geolocation) {
      messagePosition.textContent =
        "❌ La géolocalisation n'est pas disponible sur cet appareil.";
      return;
    }

    messagePosition.textContent = "📍 Recherche de votre position...";

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        messagePosition.innerHTML =
          "✅ Position trouvée.<br>" +
          "Latitude : " + latitude + "<br>" +
          "Longitude : " + longitude;
      },

      (erreur) => {
        console.error(erreur);

        messagePosition.textContent =
          "❌ Impossible de récupérer votre position.";
      },

      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }
    );

  });
</script>
</body>
</html>
